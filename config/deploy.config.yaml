# config/deploy.config.yaml — project-level deploy settings.
# Read by scripts/deploy.sh. Commit this file. Do NOT put secrets here.

project: student-accounts
default_backend: compose

environments:
  dev:
    backend: compose
    context: ""                  # blank = current docker context (default/orbstack)
    compose_files:
      - docker-compose.yaml
      - docker-compose.dev.yaml

  prod:
    backend: swarm
    context: swarm1              # ssh://root@swarm1.dojtl.net (caddy overlay net already up)
    stack: student-accounts
    stack_file: docker-stack.yaml
    # All secrets ride along in env_file via dotconfig; no separate swarm secrets.
    swarm_secrets: []
