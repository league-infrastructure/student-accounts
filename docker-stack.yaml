# docker-stack.yaml — Swarm stack for prod (apps.jointheleague.org).
# Deploy via: docker stack deploy -c docker-stack.yaml --with-registry-auth student-accounts
# scripts/deploy.sh prod up handles this for you (and syncs swarm secrets first).
#
# Caddy: an external caddy-docker-proxy on the host watches the Swarm API and
# routes apps.jointheleague.org → this service. Service-level Caddy labels MUST
# go under deploy.labels in Swarm — service `labels:` are container labels and
# are ignored by caddy-docker-proxy.

services:
  web:
    # IMAGE_TAG is exported by scripts/_lib.sh from package.json — pinned per deploy.
    image: "${IMAGE_REPO:-ghcr.io/league-infrastructure/student-accounts}:${IMAGE_TAG:?IMAGE_TAG not set — run via scripts/up.sh}"
    # Swarm `stack deploy` ignores env_file. scripts/up.sh pre-renders this file
    # with `docker compose config` (which DOES inline env_file → environment),
    # then pipes the rendered YAML into `stack deploy`.
    env_file:
      - path: .deploy/.env.prod
        required: false
    environment:
      # Overrides whatever the env_file says — these must be container-shape values.
      NODE_ENV: production
      PORT: "5201"
      DATABASE_URL: "file:/app/data/app.db"
    volumes:
      - app-data:/app/data
    deploy:
      replicas: 1
      placement:
        # SQLite is single-writer; pin to one node so the volume always lands there.
        constraints: [node.role == manager]
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      labels:
        caddy: student-accounts.jtlapp.net
        caddy.reverse_proxy: "{{upstreams 5201}}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5201/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - caddy

volumes:
  app-data:

networks:
  caddy:
    external: true
    name: caddy
